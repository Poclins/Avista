# jAImes - demo local con backend y Postgres/pgvector.
# Los proveedores locales son el comportamiento predeterminado; no requiere AWS.

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql+psycopg://jaimes:jaimes@db:5432/jaimes"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: jaimes
      POSTGRES_PASSWORD: jaimes
      POSTGRES_DB: jaimes
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jaimes -d jaimes"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

